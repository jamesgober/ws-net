# =============================================================================
#  ws-net competitor benchmarks (not published, not part of ws-net's graph)
# =============================================================================
#
# The same wire bytes parsed and produced by ws-net and by tungstenite, the
# reference sync Rust implementation, at each one's lowest public layer.
# Competitors are dependencies here and only here; ws-net itself has no
# third-party runtime dependency. Async-runtime libraries (fastwebsockets,
# tokio-websockets) are left out: no async runtime is used anywhere in this
# repository.
[package]
name         = "ws-net-bench-compare"
version      = "0.0.0"
publish      = false
edition      = "2024"
rust-version = "1.85"
license      = "Apache-2.0 OR MIT"

[dependencies]
ws-net      = { path = ".." }
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name    = "compare"
harness = false

[profile.bench]
opt-level     = 3
lto           = "fat"
codegen-units = 1

# A standalone package, not a member of any workspace.
[workspace]
