name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Run every JS action on Node.js 24 ahead of GitHub's forced migration,
  # silencing "Node.js 20 actions are deprecated" runner warnings.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: Test (default features)
        run: cargo test
      - name: Test (all features)
        run: cargo test --all-features
      - name: Test (no default features)
        run: cargo test --no-default-features
      - name: Build examples
        run: cargo build --examples
      - name: Doc (default features)
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: Doc (all features)
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  targets:
    name: 32-bit build (i686)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Check (default features)
        run: cargo check --target i686-unknown-linux-gnu --all-targets
      - name: Check (no default features)
        run: cargo check --target i686-unknown-linux-gnu --no-default-features
      - name: Check (no_std with deflate)
        run: cargo check --target i686-unknown-linux-gnu --no-default-features --features deflate
      - name: Package
        run: cargo package --allow-dirty

  autobahn:
    name: Autobahn TestSuite (both roles)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the test peers (with permessage-deflate for 12.x and 13.x)
        run: cargo build --release --features deflate --example autobahn_server --example autobahn_client
      - name: Pull the suite
        run: docker pull crossbario/autobahn-testsuite:25.10.1
      - name: Server role (fuzzingclient)
        run: |
          mkdir -p autobahn/reports
          ./target/release/examples/autobahn_server 127.0.0.1:9001 &
          sleep 2
          docker run --rm --net=host -v "$PWD/autobahn:/config" -v "$PWD/autobahn/reports:/reports"             crossbario/autobahn-testsuite:25.10.1 wstest -m fuzzingclient -s /config/fuzzingclient.json
          python3 autobahn/check.py autobahn/reports/servers/index.json
      - name: Client role (fuzzingserver)
        run: |
          docker run -d --name fuzzingserver --net=host -v "$PWD/autobahn:/config" -v "$PWD/autobahn/reports:/reports"             crossbario/autobahn-testsuite:25.10.1 wstest -m fuzzingserver -s /config/fuzzingserver.json
          for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/9002) 2>/dev/null && break; sleep 1; done
          ./target/release/examples/autobahn_client 127.0.0.1:9002
          docker stop fuzzingserver
          python3 autobahn/check.py autobahn/reports/clients/index.json
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autobahn-reports
          path: autobahn/reports/

  fuzz:
    name: Fuzz targets (build, 30 s each)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Build
        run: cd fuzz && cargo +nightly fuzz build --target x86_64-unknown-linux-gnu
      - name: Run each target for 30 seconds
        run: |
          cd fuzz
          for t in $(cargo +nightly fuzz list); do
            mkdir -p "corpus/$t"
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$t" "corpus/$t" -- -max_total_time=30 -rss_limit_mb=4096
          done

  tls:
    name: ws-net over tls-net (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: interop/tls
      - name: Test
        run: cd interop/tls && cargo test

  netio:
    name: ws-net on net-io (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: interop/net-io
      - name: Test
        run: cd interop/net-io && cargo test

  security:
    name: Security (audit + deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Audit
        run: cargo audit
      - name: Deny
        run: cargo deny check
