# =============================================================================
#  R E P S   ·   ws-net
# =============================================================================
[package]
name    = "ws-net"
version = "0.2.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "Sans-IO WebSocket (RFC 6455) engine: opening handshake, framing, masking, fragmentation with incremental UTF-8 validation, ping/pong, close handshake, size budgets, no dependencies."

# Keywords (5 max)
keywords = ["websocket", "rfc6455", "protocol", "sans-io", "network"]

# Categories
categories = ["network-programming", "web-programming", "no-std"]

# Links
homepage      = "https://github.com/jamesgober/ws-net"
repository    = "https://github.com/jamesgober/ws-net"
documentation = "https://docs.rs/ws-net"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "ws_net"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = ["std"]
# OS-seeded masking keys and handshake nonces (Connection::client,
# ClientHandshake::new). Without it the crate is no_std and needs only
# `alloc`; clients then take a caller-supplied seed.
std = []


# DEPENDENCIES
# #################################
[dependencies]
# None. SHA-1 and base64 for the handshake are small private modules until
# the owner's crypto and codec libraries are published (dev/ROADMAP.md).


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1"


# BENCHMARKS
# #################################
[[bench]]
name    = "bench"
harness = false


# EXAMPLES
# #################################
[[example]]
name              = "sans_io"
required-features = ["std"]

[[example]]
name              = "echo_server"
required-features = ["std"]


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
