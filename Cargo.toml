# =============================================================================
#  R E P S   ·   ws-net
# =============================================================================
[package]
name    = "ws-net"
version = "0.3.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "Sans-IO WebSocket (RFC 6455) engine: opening handshake, framing, masking, fragmentation with incremental UTF-8 validation, ping/pong, close handshake, size budgets, same-origin policy, no third-party dependencies."

# Keywords (5 max)
keywords = ["websocket", "rfc6455", "protocol", "sans-io", "network"]

# Categories
categories = ["network-programming", "web-programming", "no-std"]

# Links
homepage      = "https://github.com/jamesgober/ws-net"
repository    = "https://github.com/jamesgober/ws-net"
documentation = "https://docs.rs/ws-net"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "ws_net"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = ["std"]
# Masking-key seeds and handshake nonces from the OS cryptographic random
# source through mod-rand (Connection::client, ClientHandshake::new).
# Without it the crate is no_std and needs only `alloc`; clients then take a
# caller-supplied seed.
std = ["dep:mod-rand"]


# DEPENDENCIES
# #################################
[dependencies]
# First party, no third-party dependencies of its own: the shared RFC 9110
# grammar (tokens, OWS, lists, field-value checks, Origin, Host). Default
# features off: no_std, no allocator.
parse-net = { version = "0.9", default-features = false }
# First party, no dependencies: the OS cryptographic random source (its
# tier 3) for masking seeds and nonces, feature `std` only.
mod-rand = { version = "1", default-features = false, features = ["tier3"], optional = true }
# SHA-1 and base64 for the handshake stay small private modules: crypt-io
# ships no SHA-1 by design and the owner's codec library has no base64
# (dev/ROADMAP.md, dependency wiring).


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
# The upgrade hand-off integration test only; never a runtime dependency.
http-net  = "0.9"
proptest  = "1"


# BENCHMARKS
# #################################
[[bench]]
name    = "bench"
harness = false


# EXAMPLES
# #################################
[[example]]
name              = "sans_io"
required-features = ["std"]

[[example]]
name              = "echo_server"
required-features = ["std"]

[[example]]
name              = "accept_policy"

[[example]]
name              = "keepalive"

[[example]]
name              = "broadcast"

[[example]]
name              = "blocking_echo"
required-features = ["std"]

[[example]]
name              = "blocking_client"
required-features = ["std"]

[[example]]
name              = "http_net_upgrade"
required-features = ["std"]


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
